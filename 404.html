<script>

  var map = {
    "": "professional", "work": "professional", "professional": "professional",
    "play": "personal", "personal": "personal", "about-me": "about", "about": "about",

    "izone": "izone", "girls-who-code": "girls-who-code"
  };
  var files = { "resume": "AnaGalic_Resume.pdf" };
  var base = location.hostname.slice(-10) === ".github.io" ? "/anagalicportfolio/" : "/";
  var path = location.pathname;
  if (path.indexOf(base) === 0) path = path.slice(base.length);
  path = path.replace(/\/+$/, "").toLowerCase();
  if (files[path]) { location.replace(base + files[path]); return; }
  var target = map[path];
  location.replace(base + (target ? "#" + target : ""));
})();
</script>
