<title>Ana Galic</title>

<script>
(function () {
  var map = {
    "": "work", "work": "work", "about-me": "about", "about": "about", "resume": "resume",
    "play": "play", "peaceland-research": "peaceland-research",
    "work/peaceland": "peaceland", "work/soulshine": "soulshine", "work/vals": "vals",
    "work/promotional-material": "promotional-material"
  };
  var base = location.hostname.slice(-10) === ".github.io" ? "/anagalicportfolio/" : "/";
  var path = location.pathname;
  if (path.indexOf(base) === 0) path = path.slice(base.length);
  path = path.replace(/\/+$/, "").toLowerCase();
  var target = map[path];
  location.replace(base + (target ? "#" + target : ""));
})();
</script>
